<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Task 9: SEO -->
  <title>Interest Rate Calculator - Quickly Calculate Interest on Loans</title>
  <meta name="description" content="Quickly and accurately calculate interest rates on loans with our easy-to-use interest rate calculator. Determine the interest you'll pay and make informed financial decisions. Try our free online calculator now.">

  <!-- Task 1: favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Task 2: CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Interest Rate Calculator</h1> <!-- Task 9: h1 -->

    <!-- keep your original inputs; ids must match script.js -->
    <div class="input-wrapper">
      <label for="principal">Principal Amount</label>
      <input type="number" id="principal" value="1000" />
    </div>
    <div class="input-wrapper">
      <label for="rate">Rate (%)</label>
      <input type="number" id="rate" value="5" />
    </div>
    <div class="input-wrapper">
      <label for="time">Time (Years)</label>
      <input type="number" id="time" value="1" />
    </div>

    <button id="calculate-btn" onclick="calculate()">Calculate</button>
    <div id="result"></div>
  </div>

  <!-- Task 3: JavaScript, just before </body> -->
  <script src="script.js"></script>
</body>
</html>
